name: Rally
description: >-
  Rally (Rally Rd.) is an alternative-asset investing platform that lets everyday
  investors buy and sell equity shares in individual collectible assets — classic
  cars, watches, fine art, wine, sports memorabilia, trading cards, and other rare
  items. Rally sources and authenticates each item, files it with the SEC as a
  regulated offering, splits it into shares in an Initial Offering, and then opens
  a Bid/Ask secondary market roughly 90 days later so shareholders can trade.
  Founded in 2016 and headquartered in New York, Rally runs iOS, Android, and web
  apps and raised a $30M Series B led by Accel in 2021. Rally publishes no public
  developer API, SDKs, or documentation surface; this profile captures its identity
  and probed domain-security posture.
